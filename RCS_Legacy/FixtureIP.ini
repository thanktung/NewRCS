; FixtureIP.ini — IP:port CỨNG của TOÀN BỘ 30 fixture (MAX_BOX_COUNT).
;
; File này liệt kê đủ 30 fixture theo đúng năng lực tối đa của hệ thống,
; KHÔNG phụ thuộc trạm hiện tại dùng bao nhiêu box. box_count trong
; station.ini mới là cái quyết định trạm này thực sự DÙNG bao nhiêu
; fixture trong danh sách dưới đây (chỉ box_id từ 1..box_count được dùng,
; các dòng còn lại bị bỏ qua, không cần xoá).
;
; Ví dụ: box_count = 8 trong station.ini -> chỉ fixture 1..8 bên dưới
; được scheduler dùng, fixture 9..30 vẫn nằm sẵn trong file, chờ khi nào
; station.ini tăng box_count lên thì tự động dùng tới mà không cần sửa
; file này.
;
; Định dạng mỗi dòng (BẮT BUỘC ghi cả ip và port, cách nhau dấu ":"):
;   box_id = ip:port
;
; Fixture nào CHƯA lắp / chưa có IP thật: xoá dòng đó (hoặc để nguyên rồi
; comment lại bằng dấu ";" ở đầu dòng) — box đó sẽ tự fallback về địa chỉ
; mô phỏng (box_host + box_start_port trong station.ini), tức vẫn chạy
; được BoxSimulator.py trên localhost để test box đó.

