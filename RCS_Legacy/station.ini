; station.ini - Per-station settings. Edit ONLY this file (and FixtureIP.ini)
; when deploying to a new station. No Python knowledge needed.
;
; Numbering conventions (keep unless the real robot uses another one):
;   box_id    : starts at 1  (Box 1 .. box_count)
;   head_id   : starts at 0  (Head 0 .. gripper_heads-1)
;   tray slot : starts at 0  (slot 0 .. cols*rows-1)
;   tray_id   : starts at 1  (Tray 1, Tray 2); tray 0 = NG tray

[system]
station_name = Test Station
; sim  : boxes use box_host + box_start_port (run sim/box_simulator.py)
; real : boxes use the fixed IP:port listed in FixtureIP.ini
mode = sim

[network]
box_host       = 127.0.0.1
box_start_port = 5001
; box i (i=1..box_count) -> port box_start_port + i - 1   (sim mode only)
robot_host     = 127.0.0.1
robot_port     = 6000

[scale]
; Hard limits: box_count <= 30, 2 <= gripper_heads <= 15
box_count      = 30
gripper_heads  = 8

[tray]
; Physical size (rows x cols). Hard limit 20 x 20.
cols = 8
rows = 5
; NG tray capacity - leave empty to use cols*rows
ng_tray_slots =

[layout]
; UI grouping of boxes. Format: label = start-end (inclusive).
; The ranges MUST cover exactly 1..box_count, no gaps / overlaps.
Side A = 1-8
Side B = 9-16
Side C = 17-24
Side D = 25-30

[timing]
poll_interval        = 0.2
; Robot DONE timeout (seconds). legacy: recv timeout, v2: wait for DONE/ERR.
robot_recv_timeout   = 30.0
; DEPRECATED / ignored: motion commands are never re-sent (a timeout -> FAULT).
; Kept only so old station.ini files still load.
robot_max_retries    = 3
box_recv_timeout     = 5.0
box_connect_timeout  = 3.0
box_reconnect_backoff = 2.0

[robot]
; legacy : "PICK:1,5,2;" -> "DONE:PICK"            (current Fanuc program)
; v2     : "#12 PICK:1,5,2;" -> ACK / DONE / ERR      (see docs/PROTOCOL_V2.md)
protocol = legacy
; --- v2 only ---
ack_timeout        = 3.0
; Send one command for several heads/boxes. Needs robot support.
batch_enabled      = 0
batch_max_items    = 4
; Seconds between STATUS? heartbeats, 0 = off
heartbeat_interval = 0

[policy]
; tray1  : PASS boards are placed into the first empty slot of tray 1
; origin : PASS boards return to the exact slot they were picked from
place_policy = tray1
; Auto-disable a box after N consecutive FAIL results (0 = never)
box_fail_streak_limit = 0
; Re-test a NG board once in another box before final NG
retest_ng = 0

[watchdog]
; Seconds. 0 = off. Raise a warning when a box stays in a state too long.
test_timeout_sec  = 0
ready_timeout_sec = 0

[paths]
; Relative paths are resolved against the folder of station.ini.
; Empty = default (station_last_state.json, logs/).
state_file =
log_dir =
results_dir =

